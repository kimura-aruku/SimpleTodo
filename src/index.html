<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Todo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Todoリスト">
        <header class="sidebar-header">
          <h2>Lists</h2>
          <div class="list-actions">
            <button class="icon-button danger" id="deleteListButton" type="button" aria-label="選択中のTodoリストを削除" title="選択中のTodoリストを削除">-</button>
            <button class="icon-button primary" id="addListButton" type="button" aria-label="Todoリストを追加" title="Todoリストを追加">+</button>
          </div>
        </header>
        <ul class="list-nav" id="listNav"></ul>
      </aside>

      <section class="content-pane">
        <header class="app-header">
          <div>
            <input class="list-title-field" id="currentListTitle" type="text" value="読み込み中" aria-label="選択中のTodoリスト名" />
            <p id="summaryText">読み込み中</p>
          </div>
          <div class="top-actions">
            <button class="icon-button primary" id="addTopButton" type="button" aria-label="末尾にTodoを追加" title="末尾にTodoを追加">+</button>
            <select class="detail-mode-select" id="detailModeSelect" aria-label="Todo詳細表示">
              <option value="simple">シンプル</option>
              <option value="deadline">締切</option>
              <option value="effort">工数</option>
            </select>
          </div>
        </header>

        <section class="filter-bar" aria-label="表示フィルタ">
          <label>
            <input id="showIncomplete" type="checkbox" checked />
            未完了
          </label>
          <label>
            <input id="showCompleted" type="checkbox" checked />
            完了
          </label>
        </section>

        <section class="todo-panel" aria-label="Todo一覧">
          <ul class="todo-list" id="todoList"></ul>
          <p class="empty-message" id="emptyMessage" hidden>表示できるTodoがありません</p>
        </section>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
